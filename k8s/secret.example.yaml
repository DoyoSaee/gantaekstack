# 실제 값 채워서 gantaek-secrets 로 생성 (이 파일은 예시 — 실값 커밋 금지)
# kubectl create secret generic gantaek-secrets \
#   --from-literal=DATABASE_URL='postgresql://postgres:<PW>@<POSTGRES_SVC>:5432/gantaek?schema=public' \
#   --from-literal=GEMINI_API_KEY='<KEY>' \
#   --from-literal=GEMINI_MODEL='gemini-2.5-flash' \
#   --from-literal=MOEF_API_KEY='<KEY>' \
#   --from-literal=CRON_SECRET='<RANDOM>'
apiVersion: v1
kind: Secret
metadata:
  name: gantaek-secrets
  namespace: default
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:CHANGE_ME@postgres-service:5432/gantaek?schema=public"
  GEMINI_API_KEY: "CHANGE_ME"
  GEMINI_MODEL: "gemini-2.5-flash"
  MOEF_API_KEY: "CHANGE_ME"
  CRON_SECRET: "CHANGE_ME"
