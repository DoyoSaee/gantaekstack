# CI: main 푸시 → amd64 이미지 빌드 → ghcr 푸시
# CD: 서버에서 `kubectl rollout restart deploy/gantaek` (imagePullPolicy: Always라 :latest 재풀)
name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/doyosaee/gantaek:latest
            ghcr.io/doyosaee/gantaek:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
