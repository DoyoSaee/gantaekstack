<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 간택스택 앱 아이콘 — "ㄱ이 머리다" 고양이 마크 (원본 APP ICON 타일: 라즈베리+수염 2가닥·굵은 획) -->
  <rect width="512" height="512" rx="112" fill="#F32859"/>
  <g fill="#FEFEFE">
    <!-- ㄱ: 이마 + 오른쪽 윤곽 -->
    <rect x="122.6" y="146" width="266.4" height="16.7" rx="8.3"/>
    <rect x="372.4" y="146" width="16.7" height="199.8" rx="8.3"/>
    <!-- 왼쪽 눈 ㅌ -->
    <rect x="149.2" y="196" width="63.3" height="15" rx="7.5"/>
    <rect x="149.2" y="220.3" width="63.3" height="15" rx="7.5"/>
    <rect x="149.2" y="244.3" width="63.3" height="15" rx="7.5"/>
    <rect x="149.2" y="196" width="15" height="63.3" rx="7.5"/>
    <!-- 오른쪽 눈 ㅌ -->
    <rect x="262.5" y="196" width="63.3" height="15" rx="7.5"/>
    <rect x="262.5" y="220.3" width="63.3" height="15" rx="7.5"/>
    <rect x="262.5" y="244.3" width="63.3" height="15" rx="7.5"/>
    <rect x="262.5" y="196" width="15" height="63.3" rx="7.5"/>
    <!-- 입 ㅅ (±27°) -->
    <rect x="229.8" y="279.2" width="16.7" height="59.9" rx="8.3" transform="rotate(-27 238.1 279.2)"/>
    <rect x="229.8" y="279.2" width="16.7" height="59.9" rx="8.3" transform="rotate(27 238.1 279.2)"/>
    <!-- 수염 2가닥×양쪽 (±20°, 얼굴 쪽 고정점) -->
    <rect x="62.7" y="239.2" width="50" height="13.3" rx="6.6" transform="rotate(20 112.7 245.9)"/>
    <rect x="62.7" y="279.2" width="50" height="13.3" rx="6.6" transform="rotate(-20 112.7 285.9)"/>
    <rect x="398.9" y="239.2" width="50" height="13.3" rx="6.6" transform="rotate(-20 398.9 245.9)"/>
    <rect x="398.9" y="279.2" width="50" height="13.3" rx="6.6" transform="rotate(20 398.9 285.9)"/>
  </g>
</svg>
