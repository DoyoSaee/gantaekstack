<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 파비콘: 최소크기 규칙(획만 굵히고 구조 유지·눈은 3단) — 수염 생략, 획 0.05em 균일, 얼굴 풀블리드 -->
  <rect width="512" height="512" rx="112" fill="#F32859"/>
  <g fill="#FEFEFE">
    <!-- ㄱ: 이마 + 오른쪽 윤곽 -->
    <rect x="32" y="88" width="448" height="28" rx="14"/>
    <rect x="452" y="88" width="28" height="336" rx="14"/>
    <!-- 왼쪽 눈 ㅌ -->
    <rect x="76.8" y="172" width="106.4" height="28" rx="14"/>
    <rect x="76.8" y="212.9" width="106.4" height="28" rx="14"/>
    <rect x="76.8" y="253.2" width="106.4" height="28" rx="14"/>
    <rect x="76.8" y="172" width="28" height="106.4" rx="14"/>
    <!-- 오른쪽 눈 ㅌ -->
    <rect x="267.2" y="172" width="106.4" height="28" rx="14"/>
    <rect x="267.2" y="212.9" width="106.4" height="28" rx="14"/>
    <rect x="267.2" y="253.2" width="106.4" height="28" rx="14"/>
    <rect x="267.2" y="172" width="28" height="106.4" rx="14"/>
    <!-- 입 ㅅ (±27°) -->
    <rect x="212.3" y="312" width="28" height="100.8" rx="14" transform="rotate(-27 226.3 312)"/>
    <rect x="212.3" y="312" width="28" height="100.8" rx="14" transform="rotate(27 226.3 312)"/>
  </g>
</svg>
